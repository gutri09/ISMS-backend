services:
  postgres:
    image: postgres:16-alpine
    container_name: isms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: isms_intelligence_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isms_intelligence_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
